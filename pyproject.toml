[build-system]
requires = ["setuptools", "setuptools-scm", "cython>=3.2.9", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rp2040py"
authors = [{ name = "o-murphy", email = "thehelixpg@gmail.com" }]
description = "A Raspberry Pi Pico Emulator in Python"
readme = "README.md"
requires-python = ">=3.10"
keywords = []
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "argcomplete>=3.7.2",
    "mpremote>=1.28.0",
    "pyelftools>=0.33",
    "semver>=3.0.4",
]
dynamic = ["version"]

[project.optional-dependencies]
fs = ["littlefs-python>=0.18.0"]

[project.scripts]
rp2040py = "rp2040py.__main__:main"

[project.urls]
"Homepage" = "https://github.com/o-murphy/rp2040py"
"Documentation" = "https://o-murphy.github.io/rp2040py"
"Bug Reports" = "https://github.com/o-murphy/rp2040py/issues"
"Source" = "https://github.com/o-murphy/rp2040py"

[tool.pytest.ini_options]
minversion = "9"
addopts = "-rf"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# tests/micropython/*.py are MicroPython payload scripts that run *inside* the emulated device,
# copied verbatim from upstream rp2040js's test fixtures - not our code style to enforce.
# tests/circuitpython/*.py are the same kind of thing for CircuitPython (authored here rather than
# inherited): guest-side scripts written against the *device's* stdlib, where e.g. bare
# `except Exception` is deliberate - a payload script's job is to print what went wrong and keep
# going, not to model host-side exception hygiene.
extend-exclude = ["tests/micropython", "tests/circuitpython"]

[tool.ruff.lint]
ignore = []

[tool.ruff.lint.per-file-ignores]
# (boards/ needed an N999 exemption while its directories mirrored upstream board-port names
# verbatim, uppercase and all; docs/records/0059 case-normalized them - `boards/weactstudio/` for
# MicroPython's `ports/rp2/boards/WEACTSTUDIO` - so PEP8 module naming applies there unassisted.)
# `0xcb_gemini.py` is a permanent exception, not a case-normalization gap: CircuitPython's own board
# id genuinely starts with a digit, so no case-normalized spelling can ever satisfy PEP8 module
# naming here (docs/records/0083). Only the `--board-spec path:ATTR` file-loading form works for it
# as a result - documented in the file's own docstring.
"boards/0xcb_gemini.py" = ["N999"]

[tool.mypy]
mypy_path = "src"
files = ["src"]
disable_error_code = ["annotation-unchecked"]
# Pinned rather than left to default to sys.platform: mypy's own `termios`/`tty` stubs are
# near-empty on win32 (those modules are genuinely POSIX-only), so leaving this unpinned makes
# analysis results depend on which OS runs the lint job - the CI matrix added in `e9af01a` started
# running this on windows-latest too, which then flagged `cli/stdio_repl.py`'s termios/tty usage as
# missing attributes even though it's correctly gated behind `try: import termios / except
# ImportError: termios = None` for exactly that platform. Pinning to linux makes the check
# consistent everywhere and matches every other POSIX-only import pattern in this codebase.
platform = "linux"

# rp2040py.native's compiled extension modules aren't always built (see setup.py's soft fallback
# when Cython/a C compiler isn't available), so mypy can't reliably resolve them here. The
# try/except ImportError fallback pattern (see rp2040py/utils/bit.py, rp2040py/rp2040.py) is what
# actually handles their absence at runtime; this just quiets the analysis-time noise.
[[tool.mypy.overrides]]
module = "rp2040py.native.*"
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["rp2040py*"]

[tool.setuptools_scm]
root = "."
fallback_version = "0.0.0.dev0"

[tool.cibuildwheel]
# Use uv and build
build-frontend = "build[uv]"
# cp310 gets its own normal, version-specific wheel: Py_LIMITED_API's buffer-protocol support
# (needed by this project's typed memoryviews) only entered the limited API at 3.11 - confirmed
# by trying to force the floor down to 3.10, which fails to compile (see setup.py/docs/BACKLOG.md).
# cp311-* builds once and self-tags as cp311-abi3 (setup.py's _bdist_wheel_abi3), covering every
# 3.11+ interpreter with that one wheel. Free-threaded (cp314t-*) is separate for the usual reason:
# Py_LIMITED_API and Py_GIL_DISABLED are mutually incompatible.
build = "cp310-* cp311-* cp314t-*"
test-extras = "fs"
test-requires = "pytest"
# cibuildwheel runs tests from a scratch directory (not the repo checkout) so only the built
# wheel's contents are ever imported - {project} is substituted with the repo root so pytest can
# still find the test suite itself (tests/ isn't part of the wheel).
test-command = "pytest {project}/tests"
test-skip = "*-pyodide_*"

[tool.cibuildwheel.android]
test-extras = ""
test-sources = ["tests", "pyproject.toml"]
test-command = "python -m pytest tests"
build = "cp313-android_* cp314-android_*"

# pthread is not allowed 
# [tool.cibuildwheel.pyodide]
# build = "cp313-pyodide_* cp314-pyodide_*"

[dependency-groups]
dev = [
    "mypy>=2.3.0; implementation_name != 'pypy'",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "rp2040py[fs]",
    "pytest-cov>=7.1.0",
    "littlefs-python>=0.18.0",
    "cython>=3.2.9",
]
