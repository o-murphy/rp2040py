default_install_hook_types: [pre-commit]
default_language_version:
  python: python3

repos:
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock check
        entry: uv
        args: ["lock", "--check"]
        language: system
        pass_filenames: false
        # files: '^(pyproject\.toml|uv\.lock)$'

      - id: uv-sync
        name: uv sync before hooks
        entry: uv
        args: ["sync", "--python", "cpython-3.10"]
        language: system
        pass_filenames: false
        files: '^(pyproject\.toml|uv\.lock)$|\.(py|pyx|pyd)$'

      - id: uv-mypy
        name: mypy
        entry: uv
        args: ["run", "mypy"]
        language: system
        pass_filenames: false
        files: '\.(py|pyx|pyd)$'

      - id: uv-ruff-check
        name: ruff lint & fix
        entry: uv
        args: ["run", "ruff", "check", "--fix"]
        language: system
        pass_filenames: false
        files: '\.(py|pyx|pyd)$'

      - id: uv-ruff-format
        name: ruff format
        entry: uv
        args: ["run", "ruff", "format"]
        language: system
        pass_filenames: false
        files: '\.(py|pyx|pyd)$'

      # pre-commit's hook schema has no `env:` key (language: system runs entry/args directly,
      # no shell) - `env VAR=val cmd...` is the portable way to set one for the child process.
      # --oracle=off: the lockstep oracles/parity tests (~87 % of the suite) build the native block and its pure-Python
      # reference explicitly, whatever RP2040PY_SKIP_CYTHON says, so re-running them here would repeat the native run below
      # (tests/test_batch_parity.py even skips itself under it). Everything else still runs on the pure-Python facades.
      - id: uv-pytest-pure
        name: uv run pytest (pure-Python, RP2040PY_SKIP_CYTHON=1, no oracles)
        entry: env
        args: ["RP2040PY_SKIP_CYTHON=1", "uv", "run", "pytest", "--oracle=off"]
        language: system
        pass_filenames: false
        files: '\.(py|pyx|pyd)$'

      - id: uv-pytest-native
        name: uv run pytest (native-cpython-extensions, RP2040PY_SKIP_CYTHON=0)
        entry: env
        args: ["RP2040PY_SKIP_CYTHON=0", "uv", "run", "pytest"]
        language: system
        pass_filenames: false
        files: '\.(py|pyx|pyd)$'
