default_install_hook_types: [pre-commit]
default_language_version:
  python: python3

repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock
        entry: uv
        args: ["lock", "--upgrade"]
        language: system
        pass_filenames: false

      - id: uv-sync
        name: uv sync before hooks
        entry: uv
        args: ["sync"]
        language: system
        pass_filenames: false

      - id: uv-mypy
        name: mypy
        entry: uv
        args: ["run", "mypy"]
        language: system
        pass_filenames: false

      - id: uv-ruff-check
        name: ruff lint & fix
        entry: uv
        args: ["run", "ruff", "check", "--fix"]
        language: system
        pass_filenames: false

      - id: uv-ruff-format
        name: ruff format
        entry: uv
        args: ["run", "ruff", "format"]
        language: system
        pass_filenames: false

      - id: uv-pytest
        name: uv run pytest
        entry: uv
        args: ["run", "pytest"]
        language: system
        pass_filenames: false
