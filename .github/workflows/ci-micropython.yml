name: Test MicroPython Releases

on:
  push:
    # branches only: a pushed tag is the same commit as the branch it was cut from, which already ran
    branches: ["**"]
    paths-ignore: &non-code-paths
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore: *non-code-paths

concurrency:
  group: ci-micropython-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The three littlefs images below don't depend on micropython_version or python_runtime at all
  # (same source .py files every time) - built once here and shared via artifact instead of
  # rebuilt redundantly in every matrix job below.
  build-littlefs:
    name: Build littlefs test images
    runs-on: ubuntu-latest
    env:
      RP2040PY_SKIP_CYTHON: 1
      # mklittlefs is pure Python (littlefs-python is the only thing it needs): compiling the C++ extension and the wasm module for it would be ~1 minute of nothing.
      RP2040PY_SKIP_NATIVE_BUILD: 1
      RP2040PY_SKIP_WASM_BUILD: 1

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.10"
          github-token: ${{ github.token }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-dev --extra fs

      - name: Create filesystem
        run: uv run --no-sync rp2040py mklittlefs -o littlefs.img tests/micropython/main.py --main main.py

      - name: Create SPI test filesystem
        run: uv run --no-sync rp2040py mklittlefs -o littlefs-spi.img tests/micropython/main-spi.py --main main-spi.py

      - name: Create flash read/write test filesystem
        run: uv run --no-sync rp2040py mklittlefs -o littlefs-flash-rw.img tests/micropython/main-flash-rw.py --main main-flash-rw.py

      - name: Create reset-cause test filesystem
        run: uv run --no-sync rp2040py mklittlefs -o littlefs-reset-cause.img tests/micropython/main-reset-cause.py --main main-reset-cause.py

      - name: Upload littlefs images
        uses: actions/upload-artifact@v7
        with:
          name: littlefs-images
          path: |
            littlefs.img
            littlefs-spi.img
            littlefs-flash-rw.img
            littlefs-reset-cause.img
          retention-days: 1

  # One job per Python runtime, not per (version, runtime): the package (C++ extension + wasm module) takes minutes to build and the firmware checks themselves take seconds to
  # a minute or two, so it is built once here and scripts/ci/micropython.sh runs every version in MICROPYTHON_VERSIONS one after another (and writes the per-step table to the job summary).
  test-micropython:
    needs: build-littlefs
    name: MicroPython / ${{ matrix.python_runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python_runtime:
          - pypy-3.10
          - cpython-3.10
          - cpython-3.15
    env:
      # A ":pico_w" suffix adds the Pico W (CYW43439 Wi-Fi) checks for that version.
      MICROPYTHON_VERSIONS: "1.16 1.17 1.18 1.19.1 1.20.0 1.21.0 1.23.0:pico_w 1.28.0:pico_w 1.29.0:pico_w"
      PYTHON_JIT: ${{ matrix.python_runtime == 'cpython-3.15' && '1' || '' }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python_runtime }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python_runtime }}
          github-token: ${{ github.token }}
          enable-cache: true

      # The one build of the package for this runtime (no dev group: the checks below need only the runtime dependencies).
      - name: Install the package
        run: uv sync --python ${{ matrix.python_runtime }} --no-dev

      - name: Download littlefs images
        uses: actions/download-artifact@v8
        with:
          name: littlefs-images

      - name: Run the MicroPython checks
        run: scripts/ci/micropython.sh ${{ matrix.python_runtime }} $MICROPYTHON_VERSIONS

  test-board-spec:
    # Not part of the version/runtime matrix above on purpose - this job proves the --board-spec
    # *mechanism* itself (docs/records/0049-external-device-authoring-docs.md's "Accepted design"
    # section, extended by 0059's declarative `BoardSpec.firmware`) boots a real device end-to-end
    # via a user-supplied BoardSpec file instead of the built-in --board registry; one pinned
    # MicroPython version is enough for that, the matrix job above already covers version
    # compatibility.
    needs: build-littlefs
    name: Board-spec smoke test (tests/pico_spec.py + boards/)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.10"
          github-token: ${{ github.token }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Download littlefs images
        uses: actions/download-artifact@v8
        with:
          name: littlefs-images

      - name: Test --board-spec boots a real MicroPython image via tests/pico_spec.py
        run: timeout 5m uv run --no-dev -- rp2040py micropython --board-spec tests/pico_spec.py:BOARD --littlefs littlefs.img --expect-text "Hello, MicroPython!"
        env:
          RP2040PY_MICROPYTHON_TAG: "1.28.0"

      - name: Test RP2040PY_BOARD_SPEC env var resolves the same way as --board-spec
        run: timeout 5m uv run --no-dev -- rp2040py micropython --littlefs littlefs.img --expect-text "Hello, MicroPython!"
        env:
          RP2040PY_BOARD_SPEC: tests/pico_spec.py:BOARD
          RP2040PY_MICROPYTHON_TAG: "1.28.0"

      # tests/pico_spec.py above resolves eagerly, for a board the registry already knows. These
      # cover the other half (docs/records/0059): a boards/ file that declares `firmware` as data
      # and has it resolved at *use* time, for hardware this project does not ship - including
      # picking one of a spec's two firmware families, and --image working alongside --board-spec
      # (both of which were impossible before that record landed).
      - name: Test a declarative boards/ file resolves its own firmware at use time
        run: timeout 5m uv run --no-dev -- rp2040py micropython --board-spec boards/weactstudio/__init__.py:BOARD -c "import os; print('statvfs', os.statvfs('/'))"

      - name: Test --image alongside --board-spec, and a two-family board file's family selection
        run: |
          timeout 5m uv run --no-dev -- rp2040py micropython --board-spec boards/waveshare_rp2040_lcd_0_96/__init__.py:BOARD --image 1.28.0 -c "import sys; print(sys.implementation.version)"
          timeout 5m uv run --no-dev -- rp2040py micropython --circuitpython --board-spec boards/waveshare_rp2040_lcd_0_96/__init__.py:BOARD -c "import board; print(board.DISPLAY.width, board.DISPLAY.height)"

      - name: Test the YD-RP2040 board file boots its declared CircuitPython firmware
        run: timeout 5m uv run --no-dev -- rp2040py micropython --circuitpython --board-spec boards/vcc_gnd_yd_rp2040/__init__.py:BOARD -c "import board, os; print(board.board_id, os.statvfs('/')[:2])"

      # The same board, but checking what its WS2812 actually receives - which the step above
      # cannot, since `BoardSpec.extras` holds zero-arg factories and nothing hands a constructed
      # device back to the CLI (docs/reference/external-devices-and-boards.md). This is
      # docs/records/0063's acceptance test: the guest drives the LED through the PIO, and both the
      # decoded bytes *and* the pulse widths they came from are checked - 312/703 ns, real
      # silicon's own numbers, where before that record the emulator produced 8-40 ns with the two
      # symbols overlapping. The widths matter on their own: `Ws2812` classifies by duty cycle
      # against the frame's own period, so it would keep decoding correctly off a waveform running
      # at the wrong rate entirely, and only the widths catch that.
      - name: Test the YD-RP2040's WS2812 decodes a real PIO-driven write
        run: timeout 5m uv run --no-dev -- python tests/ws2812_boot_decode.py

      - name: Test mklittlefs sizes a board file per --target family, without a network fetch
        run: |
          uv run rp2040py mklittlefs --board-spec boards/waveshare_rp2040_lcd_0_96/__init__.py:BOARD --target micropython -o mp.img -f
          uv run rp2040py mklittlefs --board-spec boards/waveshare_rp2040_lcd_0_96/__init__.py:BOARD --target circuitpython -o cp.img -f
          test "$(stat -c%s mp.img)" -eq 1441792   # 352 blocks - MicroPython's own layout
          test "$(stat -c%s cp.img)" -eq 2097152   # 512 blocks - CircuitPython's, same board file
