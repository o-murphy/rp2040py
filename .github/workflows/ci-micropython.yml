name: Test MicroPython Releases

on:
  push:
    paths-ignore: &non-code-paths
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore: *non-code-paths

concurrency:
  group: ci-micropython-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The three littlefs images below don't depend on micropython_version or python_runtime at all
  # (same source .py files every time) - built once here and shared via artifact instead of
  # rebuilt redundantly in all 24 matrix jobs below.
  build-littlefs:
    name: Build littlefs test images
    runs-on: ubuntu-latest
    env:
      RP2040PY_SKIP_CYTHON: 1

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.10"
          github-token: ${{ github.token }}

      - name: Install dependencies
        run: uv sync

      - name: Create filesystem
        run: uv run rp2040py mklittlefs -o littlefs.img tests/micropython/main.py --main main.py

      - name: Create SPI test filesystem
        run: uv run rp2040py mklittlefs -o littlefs-spi.img tests/micropython/main-spi.py --main main-spi.py

      - name: Create flash read/write test filesystem
        run: uv run rp2040py mklittlefs -o littlefs-flash-rw.img tests/micropython/main-flash-rw.py --main main-flash-rw.py

      - name: Upload littlefs images
        uses: actions/upload-artifact@v7
        with:
          name: littlefs-images
          path: |
            littlefs.img
            littlefs-spi.img
            littlefs-flash-rw.img
          retention-days: 1

  test-micropython:
    needs: build-littlefs
    name: Micropython ${{ matrix.micropython_version.tag }} / ${{ matrix.python_runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        micropython_version:
          - tag: "1.16"
          - tag: "1.17"
          - tag: "1.18"
          - tag: "1.19.1"
          - tag: "1.20.0"
          - tag: "1.21.0"
          - tag: "1.23.0"
            pico_w: true
          - tag: "1.28.0"
            pico_w: true
          - tag: "1.29.0-preview"
        python_runtime:
          - pypy-3.10
          - cpython-3.10
          - cpython-3.14

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.10"
          github-token: ${{ github.token }}

      - name: Install dependencies
        run: uv sync

      - name: Download littlefs images
        uses: actions/download-artifact@v8
        with:
          name: littlefs-images

      - name: Setup Python ${{ matrix.python_runtime }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python_runtime }}
          github-token: ${{ github.token }}

      # Downloads (and caches) this version's UF2 outside the timed test steps below, so a slow
      # micropython.org fetch doesn't get counted as (or blow the budget of) actual boot/run time.
      # continue-on-error: a hiccup here shouldn't fail the job on its own - the real test step
      # right after will fail with a clearer signal if the download is genuinely broken.
      - name: Warm up MicroPython ${{ matrix.micropython_version.tag }} download cache
        continue-on-error: true
        run: uv run --python ${{ matrix.python_runtime }} --no-dev -- rp2040py micropython --image ${{ matrix.micropython_version.tag }} --fetch-fw-only

      - name: Test MicroPython ${{matrix.python_runtime}}-${{ matrix.micropython_version.tag }}
        run: timeout 10m uv run --python ${{ matrix.python_runtime }} --no-dev -- rp2040py micropython --image ${{ matrix.micropython_version.tag }} --littlefs littlefs.img --expect-text "Hello, MicroPython!"
        env:
          PYTHON_JIT: ${{ matrix.python_runtime == 'cpython-3.14' && '1' || '' }}

      - name: Test MicroPython SPI ${{matrix.python_runtime}}-${{ matrix.micropython_version.tag }}
        run: timeout 10m uv run --python ${{ matrix.python_runtime }} --no-dev -- python tests/micropython_spi_run.py --image ${{ matrix.micropython_version.tag }} "hello world" "h" "0123456789abcdef0123456789abcdef0123456789abcdef"
        env:
          PYTHON_JIT: ${{ matrix.python_runtime == 'cpython-3.14' && '1' || '' }}

      - name: Test MicroPython flash read/write ${{matrix.python_runtime}}-${{ matrix.micropython_version.tag }}
        run: timeout 10m uv run --python ${{ matrix.python_runtime }} --no-dev -- rp2040py micropython --image ${{ matrix.micropython_version.tag }} --littlefs littlefs-flash-rw.img --expect-text "FLASH RW OK"
        env:
          PYTHON_JIT: ${{ matrix.python_runtime == 'cpython-3.14' && '1' || '' }}

      - name: Test MicroPython flash dump is deterministic ${{ matrix.python_runtime }}-${{ matrix.micropython_version.tag }}
        run: |
          . scripts/ci-common.sh
          run_micropython_dump_test "${{ matrix.python_runtime }}" "${{ matrix.micropython_version.tag }}"
        env:
          PYTHON_JIT: ${{ matrix.python_runtime == 'cpython-3.14' && '1' || '' }}

      - name: Test MicroPython pico-w WLAN ${{matrix.python_runtime}}-${{ matrix.micropython_version.tag }}
        if: ${{ matrix.micropython_version.pico_w }}
        run: |
          timeout 15m uv run --python ${{ matrix.python_runtime }} --no-dev -- rp2040py micropython --image ${{ matrix.micropython_version.tag }} --board pico_w tests/micropython/main-cyw43.py || \
            echo "::warning title=pico-w WLAN test failed::${{ matrix.python_runtime }}-${{ matrix.micropython_version.tag }} did not complete cleanly - see docs/records/0027-cyw43-wifi.md (known raw-throughput ceiling on v1.28.0)"
        env:
          PYTHON_JIT: ${{ matrix.python_runtime == 'cpython-3.14' && '1' || '' }}
