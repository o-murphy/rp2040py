name: Test MicroPython Releases

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test-micropython:
    name: Micropython ${{ matrix.micropython_version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        micropython_version:
          - 20210618-v1.16
          - 20210902-v1.17
          - 20220117-v1.18
          - 20220618-v1.19.1
          - 20230426-v1.20.0
          - 20231005-v1.21.0
          - 20260406-v1.28.0
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync

      - name: Download Micropython
        run: curl -o micropython.uf2 "https://micropython.org/resources/firmware/RPI_PICO-${VERSION}.uf2"
        env:
          VERSION: ${{ matrix.micropython_version }}

      - name: Create filesystem
        run: uv run python tests/mklittlefs.py littlefs.img tests/micropython/main.py

      - name: Create SPI test filesystem
        run: uv run python tests/mklittlefs.py littlefs-spi.img tests/micropython/main-spi.py

      # CortexM0Core.execute_instruction() is a pure-Python instruction interpreter, and CPython
      # is much slower here than V8 JIT-compiling the equivalent JS in rp2040js (see
      # docs/PORTING.md#known-differences-from-rp2040js) - a real MicroPython + littlefs boot can
      # take several minutes under CPython, hence the generous 10-minute timeout below.
      - name: Test Micropython (CPython)
        run: timeout 10m uv run python demo/micropython_run.py --image micropython.uf2 --expect-text "Hello, MicroPython!"

      - name: Test Micropython SPI (CPython)
        run: timeout 10m uv run python tests/micropython_spi_run.py "hello world" "h" "0123456789abcdef0123456789abcdef0123456789abcdef"

      # Also test under PyPy: its JIT gives roughly a 15x instructions/sec speedup over CPython
      # for this workload (see docs/PORTING.md#known-differences-from-rp2040js), so this is the
      # realistic way to run CPU-bound firmware in the emulator day-to-day. The demo scripts have
      # zero runtime dependencies, so PyPy needs no `uv sync` of its own; littlefs.img creation
      # above stays on CPython because littlefs-python (a dev-only dependency) doesn't build under
      # PyPy 3.10 yet.
      - name: Install PyPy
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "pypy3.10"

      - name: Test Micropython (PyPy)
        run: timeout 10m uv run --python pypy3.10 --no-dev -- python demo/micropython_run.py --image micropython.uf2 --expect-text "Hello, MicroPython!"

      - name: Test Micropython SPI (PyPy)
        run: timeout 10m uv run --python pypy3.10 --no-dev -- python tests/micropython_spi_run.py "hello world" "h" "0123456789abcdef0123456789abcdef0123456789abcdef"
