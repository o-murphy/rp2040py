name: Test MicroPython Releases

on:
  push:
    paths-ignore: &non-code-paths
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore: *non-code-paths

concurrency:
  group: ci-micropython-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The three littlefs images below don't depend on micropython_version or python_runtime at all
  # (same source .py files every time) - built once here and shared via artifact instead of
  # rebuilt redundantly in all 24 matrix jobs below.
  build-littlefs:
    name: Build littlefs test images
    runs-on: ubuntu-latest
    env:
      RP2040PY_SKIP_CYTHON: 1

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.10"
          github-token: ${{ github.token }}

      - name: Install dependencies
        run: uv sync

      - name: Create filesystem
        run: uv run rp2040py mklittlefs -o littlefs.img tests/micropython/main.py --main main.py

      - name: Create SPI test filesystem
        run: uv run rp2040py mklittlefs -o littlefs-spi.img tests/micropython/main-spi.py --main main-spi.py

      - name: Create flash read/write test filesystem
        run: uv run rp2040py mklittlefs -o littlefs-flash-rw.img tests/micropython/main-flash-rw.py --main main-flash-rw.py

      - name: Upload littlefs images
        uses: actions/upload-artifact@v7
        with:
          name: littlefs-images
          path: |
            littlefs.img
            littlefs-spi.img
            littlefs-flash-rw.img
          retention-days: 1

  test-micropython:
    needs: build-littlefs
    name: Micropython ${{ matrix.micropython_version.tag }} / ${{ matrix.python_runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        micropython_version:
          - tag: "1.16"
          - tag: "1.17"
          - tag: "1.18"
          - tag: "1.19.1"
          - tag: "1.20.0"
          - tag: "1.21.0"
          - tag: "1.23.0"
            pico_w: true
          - tag: "1.28.0"
            pico_w: true
          - tag: "1.29.0-preview"
        python_runtime:
          - pypy-3.10
          - cpython-3.10
          - cpython-3.14

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.10"
          github-token: ${{ github.token }}

      - name: Install dependencies
        run: uv sync

      - name: Download littlefs images
        uses: actions/download-artifact@v8
        with:
          name: littlefs-images

      - name: Setup Python ${{ matrix.python_runtime }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python_runtime }}
          github-token: ${{ github.token }}

      # Downloads (and caches) this version's UF2 outside the timed test steps below, so a slow
      # micropython.org fetch doesn't get counted as (or blow the budget of) actual boot/run time.
      # continue-on-error: a hiccup here shouldn't fail the job on its own - the real test step
      # right after will fail with a clearer signal if the download is genuinely broken.
      - name: Warm up MicroPython ${{ matrix.micropython_version.tag }} download cache
        continue-on-error: true
        run: uv run --python ${{ matrix.python_runtime }} --no-dev -- rp2040py micropython --image ${{ matrix.micropython_version.tag }} --fetch-fw-only

      - name: Test MicroPython ${{matrix.python_runtime}}-${{ matrix.micropython_version.tag }}
        run: timeout 5m uv run --python ${{ matrix.python_runtime }} --no-dev -- rp2040py micropython --image ${{ matrix.micropython_version.tag }} --littlefs littlefs.img --expect-text "Hello, MicroPython!"
        env:
          PYTHON_JIT: ${{ matrix.python_runtime == 'cpython-3.14' && '1' || '' }}

      - name: Test MicroPython SPI ${{matrix.python_runtime}}-${{ matrix.micropython_version.tag }}
        run: timeout 5m uv run --python ${{ matrix.python_runtime }} --no-dev -- python tests/micropython_spi_run.py --image ${{ matrix.micropython_version.tag }} "hello world" "h" "0123456789abcdef0123456789abcdef0123456789abcdef"
        env:
          PYTHON_JIT: ${{ matrix.python_runtime == 'cpython-3.14' && '1' || '' }}

      - name: Test MicroPython flash read/write ${{matrix.python_runtime}}-${{ matrix.micropython_version.tag }}
        run: timeout 5m uv run --python ${{ matrix.python_runtime }} --no-dev -- rp2040py micropython --image ${{ matrix.micropython_version.tag }} --littlefs littlefs-flash-rw.img --expect-text "FLASH RW OK"
        env:
          PYTHON_JIT: ${{ matrix.python_runtime == 'cpython-3.14' && '1' || '' }}

      - name: Test MicroPython flash dump is deterministic ${{ matrix.python_runtime }}-${{ matrix.micropython_version.tag }}
        run: |
          . scripts/ci-common.sh
          run_micropython_dump_test "${{ matrix.python_runtime }}" "${{ matrix.micropython_version.tag }}"
        env:
          PYTHON_JIT: ${{ matrix.python_runtime == 'cpython-3.14' && '1' || '' }}

      - name: Test MicroPython pico-w WLAN ${{matrix.python_runtime}}-${{ matrix.micropython_version.tag }}
        if: ${{ matrix.micropython_version.pico_w }}
        run: |
          timeout 5m uv run --python ${{ matrix.python_runtime }} --no-dev -- rp2040py micropython --image ${{ matrix.micropython_version.tag }} --board pico_w tests/micropython/main-cyw43.py || \
            echo "::warning title=pico-w WLAN test failed::${{ matrix.python_runtime }}-${{ matrix.micropython_version.tag }} did not complete cleanly - see docs/records/0027-cyw43-wifi.md and docs/records/0048-cyw43-nat-reflector.md (this script now also opens a real TCP connection to 1.1.1.1:80 through the emulator's NAT bridge - a transient CI-runner network hiccup, not necessarily an emulator regression, can also cause this)"
        env:
          PYTHON_JIT: ${{ matrix.python_runtime == 'cpython-3.14' && '1' || '' }}

  test-board-spec:
    # Not part of the version/runtime matrix above on purpose - this job proves the --board-spec
    # *mechanism* itself (docs/records/0049-external-device-authoring-docs.md's "Accepted design"
    # section, extended by 0059's declarative `BoardSpec.firmware`) boots a real device end-to-end
    # via a user-supplied BoardSpec file instead of the built-in --board registry; one pinned
    # MicroPython version is enough for that, the matrix job above already covers version
    # compatibility.
    needs: build-littlefs
    name: Board-spec smoke test (tests/pico_spec.py + boards/)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.10"
          github-token: ${{ github.token }}

      - name: Install dependencies
        run: uv sync

      - name: Download littlefs images
        uses: actions/download-artifact@v8
        with:
          name: littlefs-images

      - name: Test --board-spec boots a real MicroPython image via tests/pico_spec.py
        run: timeout 5m uv run --no-dev -- rp2040py micropython --board-spec tests/pico_spec.py:BOARD --littlefs littlefs.img --expect-text "Hello, MicroPython!"
        env:
          RP2040PY_MICROPYTHON_TAG: "1.28.0"

      - name: Test RP2040PY_BOARD_SPEC env var resolves the same way as --board-spec
        run: timeout 5m uv run --no-dev -- rp2040py micropython --littlefs littlefs.img --expect-text "Hello, MicroPython!"
        env:
          RP2040PY_BOARD_SPEC: tests/pico_spec.py:BOARD
          RP2040PY_MICROPYTHON_TAG: "1.28.0"

      # tests/pico_spec.py above resolves eagerly, for a board the registry already knows. These
      # cover the other half (docs/records/0059): a boards/ file that declares `firmware` as data
      # and has it resolved at *use* time, for hardware this project does not ship - including
      # picking one of a spec's two firmware families, and --image working alongside --board-spec
      # (both of which were impossible before that record landed).
      - name: Test a declarative boards/ file resolves its own firmware at use time
        run: timeout 5m uv run --no-dev -- rp2040py micropython --board-spec boards/weactstudio/__init__.py:BOARD -c "import os; print('statvfs', os.statvfs('/'))"

      - name: Test --image alongside --board-spec, and a two-family board file's family selection
        run: |
          timeout 5m uv run --no-dev -- rp2040py micropython --board-spec boards/waveshare_rp2040_lcd_0_96/__init__.py:BOARD --image 1.28.0 -c "import sys; print(sys.implementation.version)"
          timeout 5m uv run --no-dev -- rp2040py micropython --circuitpython --board-spec boards/waveshare_rp2040_lcd_0_96/__init__.py:BOARD -c "import board; print(board.DISPLAY.width, board.DISPLAY.height)"

      - name: Test the YD-RP2040 board file boots its declared CircuitPython firmware
        run: timeout 5m uv run --no-dev -- rp2040py micropython --circuitpython --board-spec boards/vcc_gnd_yd_rp2040/__init__.py:BOARD -c "import board, os; print(board.board_id, os.statvfs('/')[:2])"

      - name: Test mklittlefs sizes a board file per --target family, without a network fetch
        run: |
          uv run rp2040py mklittlefs --board-spec boards/waveshare_rp2040_lcd_0_96/__init__.py:BOARD --target micropython -o mp.img -f
          uv run rp2040py mklittlefs --board-spec boards/waveshare_rp2040_lcd_0_96/__init__.py:BOARD --target circuitpython -o cp.img -f
          test "$(stat -c%s mp.img)" -eq 1441792   # 352 blocks - MicroPython's own layout
          test "$(stat -c%s cp.img)" -eq 2097152   # 512 blocks - CircuitPython's, same board file
