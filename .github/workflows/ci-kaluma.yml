name: Test Kaluma Releases

on:
  push:
    # branches only: a pushed tag is the same commit as the branch it was cut from, which already ran
    branches: ["**"]
    paths-ignore: &non-code-paths
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore: *non-code-paths

concurrency:
  group: ci-kaluma-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This image doesn't depend on kaluma_version or python_runtime (always the same freshly
  # formatted, empty image) - built once here and shared via artifact instead of rebuilt
  # redundantly in every matrix job below.
  build-littlefs:
    name: Build littlefs test image
    runs-on: ubuntu-latest
    env:
      RP2040PY_SKIP_CYTHON: 1

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.10"
          github-token: ${{ github.token }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Kaluma's littlefs filesystem has no auto-run semantics of its own (unlike MicroPython's
      # main.py) - it's plain storage the staged script below writes into at runtime, so this just
      # needs a freshly formatted, empty image sized to Kaluma's own board.js block layout.
      - name: Create flash read/write test filesystem
        run: uv run rp2040py mklittlefs --target kaluma -o kaluma-littlefs-flash-rw.img

      - name: Upload littlefs image
        uses: actions/upload-artifact@v7
        with:
          name: kaluma-littlefs-image
          path: kaluma-littlefs-flash-rw.img
          retention-days: 1

  # One job per Python runtime, not per (version, runtime): the package (C++ extension + wasm module) takes minutes to build and the firmware checks themselves take seconds, so
  # it is built once here and scripts/ci/kaluma.sh runs every version in KALUMA_VERSIONS one after another (and writes the per-step table to the job summary).
  test-kaluma:
    needs: build-littlefs
    name: Kaluma / ${{ matrix.python_runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python_runtime:
          - pypy-3.10
          - cpython-3.10
          - cpython-3.15
    env:
      # Only the one version manually verified end-to-end (see demo/kaluma_run.py's docstring).
      # 1.0.0/1.1.0/1.2.0 also ship a plain (non-`-w`) RP2040 `pico` build and could be added,
      # but their exact boot-banner wording (matched in scripts/ci/kaluma.sh via --expect-text) wasn't checked
      # against this older firmware, unlike 1.2.1 - 1.3.0+ dropped the plain `pico` build
      # entirely (see rp2040py.cli.firmware_specs.json's "kaluma" entry).
      KALUMA_VERSIONS: "1.2.1"
      PYTHON_JIT: ${{ matrix.python_runtime == 'cpython-3.15' && '1' || '' }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python_runtime }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python_runtime }}
          github-token: ${{ github.token }}
          enable-cache: true

      # The one build of the package for this runtime (no dev group: the tests below need only the runtime dependencies).
      - name: Install the package
        run: uv sync --python ${{ matrix.python_runtime }} --no-dev

      - name: Download littlefs image
        uses: actions/download-artifact@v8
        with:
          name: kaluma-littlefs-image

      - name: Run the Kaluma checks
        run: scripts/ci/kaluma.sh ${{ matrix.python_runtime }} kaluma-littlefs-flash-rw.img $KALUMA_VERSIONS
