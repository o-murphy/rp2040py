name: MicroPython official tests (report only)

# Runs MicroPython's own test files against the emulated board and LOGS what passes and what does not. Most groups only report: continue-on-error on the job, and the script
# exits 0 - read the job summary / artifact. The PERIPHERALS group (ports/rp2, machine) is `strict: true`: it passes completely (record 0100: rp2_dma, after the integer clock)
# so a FAIL, an ERROR or a HANG in it fails the job. A SKIP (a file that needs core 1, or skips itself) never does.

on:
  push:
    # branches only: a pushed tag is the same commit as the branch it was cut from, which already ran
    branches: ["**"]
    paths-ignore: &non-code-paths
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore: *non-code-paths

concurrency:
  group: ci-micropython-official-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The package (C++ extension + wasm module) takes ~2 minutes to build; every group below used to build it again (~18 minutes of runner time per run, about 40 % of all of it).
  # It is built once here and the groups only install the wheel.
  build-wheel:
    name: Build the package once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools-scm reads the version from the tags

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.10"
          github-token: ${{ github.token }}
          enable-cache: true

      - name: Build the wheel
        env:
          RP2040PY_REQUIRE_NATIVE: "1"  # a broken C++ build must fail here, not leave every group on the pure-Python path
        run: uv build --wheel --out-dir dist

      - name: Upload the wheel
        uses: actions/upload-artifact@v7
        with:
          name: official-suite-wheel
          path: dist/*.whl
          retention-days: 1

  official-tests:
    needs: build-wheel
    name: MicroPython ${{ matrix.micropython_tag }} official tests - ${{ matrix.group.name }} (${{ matrix.group.strict && 'gating' || 'report only' }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ !matrix.group.strict }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        micropython_tag: ["1.29.0"]
        # Groups of MicroPython's own test files (globs relative to its tests/). The CPU groups run the interpreter itself on the emulated Cortex-M0+ (Thumb inline assembly,
        # soft-float, the language tests); the peripheral group is ports/rp2 and the machine module. basics is split in two to stay well inside the job limit.
        group:
          - name: peripherals (ports/rp2, machine)
            globs: "ports/rp2/*.py extmod/machine_*.py"
            strict: true
          - name: micropython/ (interpreter internals)
            globs: "micropython/*.py"
            strict: true
          - name: extmod (modules beyond machine)
            globs: "extmod/[a-l]*.py extmod/[n-z]*.py"
            strict: true
          - name: unicode, stress, misc
            globs: "unicode/*.py stress/*.py misc/*.py"
            strict: true
          # The tests below open files or import modules that sit next to them on the host: `push` copies them onto the board (see run_suite.sh). `exclude` lists the tests that cannot
          # pass on a board whatever the emulator does (record 0098): the littlefs the board mounts does not check a file's open mode (its LFS_ASSERT is compiled out, so a write to a file
          # opened for reading succeeds and the test, which expects OSError, then corrupts the data file for the ones after it), `sys.argv` and `fileno()` are unix-port features,
          # and `__file__` is the host path in the expected output.
          - name: io (files on the board)
            globs: "io/*.py"
            push: "io/data:"
            exclude: "io/file1.py io/file_readinto.py io/file_readline.py io/file_stdio.py io/file_stdio2.py io/argv.py"
            strict: true
          - name: import (modules on the board)
            globs: "import/*.py"
            push: "import/*:"
            exclude: "import/import_file.py"
            strict: true
          # extmod_hardware: the tests that want pins wired together (MicroPython's tests/target_wiring/rp2.py: GPIO0 to GPIO1; the board file has a Jumper). machine_pwm passes; the CAN, counter,
          # encoder and SD card files skip themselves (not in the Pico build). Excluded: the UART IRQ tests (UART pins are not routed to the pads by the model) and the I2C target test (no slave mode).
          - name: extmod_hardware (GPIO0 wired to GPIO1)
            globs: "extmod_hardware/*.py"
            push: "target_wiring/rp2.py:target_wiring.py"
            board_spec: "tests/micropython_official/wired_board.py:BOARD"
            exclude: "extmod_hardware/machine_uart_irq_break.py extmod_hardware/machine_uart_irq_rx.py extmod_hardware/machine_uart_irq_rxidle.py extmod_hardware/machine_i2c_target.py"
            strict: true
          # The second core (record 0104): MicroPython's threads run on core 1. Report only: 24 of 33 pass, 9 skip themselves, none fails or hangs (a core 1 whose entry function returns parks, record 0104). It can gate once it has stayed green for a few runs (stress_create.py hung once).
          - name: thread/ (the second core)
            globs: "thread/*.py"
            core1: "1"
          - name: CPU - float, inline assembly
            globs: "float/*.py inlineasm/thumb/*.py"
          - name: CPU - basics a-l
            globs: "basics/[a-l]*.py"
          - name: CPU - basics m-z
            globs: "basics/[m-z]*.py"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.10"
          github-token: ${{ github.token }}
          enable-cache: true

      - name: Download the wheel
        uses: actions/download-artifact@v8
        with:
          name: official-suite-wheel
          path: dist

      # run_suite.sh runs the tools from `$VIRTUAL_ENV/bin` (rp2040py, mpremote, python), so this is a plain virtual environment with the wheel in it; the [fs] extra is what `uv sync` used to bring.
      - name: Install the package
        run: |
          uv venv --python 3.10
          uv pip install "rp2040py[fs] @ file://$(ls "$PWD"/dist/*.whl)"

      - name: Fetch the MicroPython firmware
        run: .venv/bin/rp2040py micropython --image ${{ matrix.micropython_tag }} --fetch-fw-only

      - name: Clone MicroPython at the same tag (its tests are the suite)
        run: git clone --depth 1 --branch v${{ matrix.micropython_tag }} https://github.com/micropython/micropython.git "$RUNNER_TEMP/micropython"

      - name: Run the suite (${{ matrix.group.strict && 'gating' || 'report only' }})
        continue-on-error: ${{ !matrix.group.strict }}
        env:
          STRICT: ${{ matrix.group.strict && '1' || '0' }}
          PUSH: ${{ matrix.group.push }}
          BOARD_SPEC: ${{ matrix.group.board_spec }}  # a board file: the extmod_hardware group wants GPIO0 wired to GPIO1
          CORE1: ${{ matrix.group.core1 }}  # "1": run the files that use `_thread` (skipped in the groups that gate the build)
          EXCLUDE: ${{ matrix.group.exclude }}
          PER_TEST_TIMEOUT: "90"  # a CI runner is slower than a workstation: the stochastic basics/class_setname_hazard_rand.py took longer than 45 s there
        run: |
          source .venv/bin/activate
          set -f  # the group's globs are for the script (relative to MicroPython's tests/), not for this shell
          GROUP_TITLE="${{ matrix.group.name }}" bash tests/micropython_official/run_suite.sh "$RUNNER_TEMP/micropython" ${{ matrix.micropython_tag }} "$RUNNER_TEMP/official-tests.md" ${{ matrix.group.globs }}

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: micropython-official-${{ matrix.micropython_tag }}-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/official-tests.md
            ${{ runner.temp }}/official-tests-full.md
          if-no-files-found: ignore
          retention-days: 14
