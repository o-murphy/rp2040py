name: Coverage

on:
  push:
    branches:
      - "main"
    paths:
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - ".github/workflows/coverage.yml"
  pull_request:
    branches:
      - "*"
    paths:
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - ".github/workflows/coverage.yml"
  workflow_dispatch:

# A branch with an open PR fires both `push` and `pull_request`; sharing the group by branch name makes one cancel the other
# (a push-only branch still gets its run).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # required for setuptools-scm

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.10"
          github-token: ${{ github.token }}
          enable-cache: true

      - name: Install the project
        run: uv sync
        shell: bash

      - name: Run coverage for native core
        run: >
          uv run pytest
          --cov=rp2040py
          --cov-report=
        shell: bash
        env:
          COVERAGE_FILE: .coverage.native

      # --oracle=off: the oracles build both backends themselves, so the native run above already covers them.
      - name: Run coverage for pure core
        run: >
          uv run pytest
          --oracle=off
          --cov=rp2040py
          --cov-report=
        shell: bash
        env:
          RP2040PY_SKIP_CYTHON: 1
          COVERAGE_FILE: .coverage.pure

      - name: Combine coverage
        run: |
          uv run coverage combine
          uv run coverage xml
          uv run coverage html
        shell: bash

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage.xml
          fail_ci_if_error: true
