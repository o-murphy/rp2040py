name: Test Pi Pico SDK

on:
  push:
    # branches only: a pushed tag is the same commit as the branch it was cut from, which already ran
    branches: ["**"]
    paths-ignore: &non-code-paths
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore: *non-code-paths

concurrency:
  group: ci-pico-sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The firmware of one SDK release: hello_world/usb (for the Python runs) and hello_world/serial (for Gate G2), built from source. This is the only part that needs the ARM toolchain and the
  # SDK, so it is separate from the runs: the package is built once per runtime in test-pico-sdk instead of once per (release, runtime) - 24 builds of ~2 minutes each.
  build-firmware:
    name: Pico SDK ${{ matrix.sdk_version }} firmware
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk_version:
          - 1.2.0
          - 1.3.1
          - 1.4.0
          - 1.5.1
          - 2.0.0
          - 2.1.1
          - 2.2.0
          - 2.3.0
    steps:
      - name: Cache Pico SDK
        id: cache-pico-sdk
        uses: actions/cache@v6
        with:
          path: ~/pico
          key: ${{ runner.os }}-pico-sdk-serial-${{ matrix.sdk_version }}

      - name: Set up the toolchain
        if: steps.cache-pico-sdk.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential

      - name: Set up the Pi Pico SDK and examples
        if: steps.cache-pico-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir ~/pico
          cd ~/pico
          git clone https://github.com/raspberrypi/pico-sdk.git --depth 1 --branch ${SDK_VERSION}
          cd pico-sdk && git submodule update --init && cd ..
          git clone https://github.com/raspberrypi/pico-examples.git --depth 1 --branch "sdk-${SDK_VERSION}"
          cd pico-examples && mkdir build && cd build && cmake .. && make -C hello_world/usb -j4 && make -C hello_world/serial -j4
        env:
          SDK_VERSION: ${{ matrix.sdk_version }}
          PICO_SDK_PATH: ~/pico/pico-sdk

      - name: Collect the images
        run: |
          mkdir firmware
          cp ~/pico/pico-examples/build/hello_world/usb/hello_usb.uf2 ~/pico/pico-examples/build/hello_world/serial/hello_serial.uf2 firmware/

      - name: Upload the images
        uses: actions/upload-artifact@v7
        with:
          name: pico-firmware-${{ matrix.sdk_version }}
          path: firmware/*.uf2
          retention-days: 1

  # One job per Python runtime, not per (release, runtime): scripts/ci/pico_sdk.sh boots every release in PICO_SDK_RELEASES one after another (and writes the per-step table to the job summary).
  test-pico-sdk:
    needs: build-firmware
    name: Pico SDK / ${{ matrix.python_runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python_runtime:
          - pypy-3.10
          - cpython-3.10
          - cpython-3.15
    env:
      PICO_SDK_RELEASES: "1.2.0 1.3.1 1.4.0 1.5.1 2.0.0 2.1.1 2.2.0 2.3.0"  # keep in step with build-firmware's matrix
      PYTHON_JIT: ${{ matrix.python_runtime == 'cpython-3.15' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python_runtime }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python_runtime }}
          github-token: ${{ github.token }}
          enable-cache: true

      # The one build of the package for this runtime (no dev group: the runs below need only the runtime dependencies).
      - name: Install the package
        run: uv sync --python ${{ matrix.python_runtime }} --no-dev

      - name: Download the images
        uses: actions/download-artifact@v8
        with:
          pattern: pico-firmware-*
          path: firmware

      - name: Run the Pico SDK checks
        run: scripts/ci/pico_sdk.sh ${{ matrix.python_runtime }} firmware $PICO_SDK_RELEASES
