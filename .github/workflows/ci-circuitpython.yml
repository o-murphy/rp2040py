name: Test CircuitPython Releases

# There was no CircuitPython CI at all before this workflow (see
# docs/records/0048-cyw43-nat-reflector.md), even though README.md documents `--circuitpython` as
# a supported mode - which is how CircuitPython 10.x's boot stall went unnoticed
# (docs/tasks/circuitpython-10x-boot-stall.md). The version matrix below deliberately lists only
# releases confirmed to reach the REPL under this emulator; adding 10.x here is the natural
# regression test for whoever fixes that.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-circuitpython:
    name: CircuitPython ${{ matrix.circuitpython_version.tag }} / ${{ matrix.python_runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        circuitpython_version:
          - tag: "8.0.2" # this project's own default (README)
          - tag: "9.2.9" # newest release in firmware_specs.json
            pico_w: true
        python_runtime:
          - pypy-3.10
          - cpython-3.10
          - cpython-3.14

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.10"
          github-token: ${{ github.token }}

      - name: Install dependencies
        run: uv sync

      - name: Setup Python ${{ matrix.python_runtime }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python_runtime }}
          github-token: ${{ github.token }}

      # Same reasoning as ci-micropython.yml: pull (and cache) the UF2 outside the timed steps, and
      # don't fail the job on a flaky download - the real step right after gives a clearer signal.
      - name: Warm up CircuitPython ${{ matrix.circuitpython_version.tag }} download cache
        continue-on-error: true
        run: uv run --python ${{ matrix.python_runtime }} --no-dev -- rp2040py micropython --circuitpython --image ${{ matrix.circuitpython_version.tag }} --fetch-fw-only

      # Boots to the friendly REPL and exits on the banner. This is the check that CircuitPython
      # 10.x currently fails (zero output, never reaches this string).
      - name: Test CircuitPython ${{ matrix.python_runtime }}-${{ matrix.circuitpython_version.tag }} boots
        run: timeout 10m uv run --python ${{ matrix.python_runtime }} --no-dev -- rp2040py micropython --circuitpython --image ${{ matrix.circuitpython_version.tag }} --expect-text "Adafruit CircuitPython"
        env:
          PYTHON_JIT: ${{ matrix.python_runtime == 'cpython-3.14' && '1' || '' }}

      # CircuitPython's counterpart of ci-micropython.yml's pico-w WLAN step, and soft-failing for
      # the same reason: it opens a real TCP connection and a real DNS query to the internet
      # through the emulator's NAT bridge, so a CI-runner network hiccup is not an emulator
      # regression.
      - name: Test CircuitPython pico-w WLAN ${{ matrix.python_runtime }}-${{ matrix.circuitpython_version.tag }}
        if: ${{ matrix.circuitpython_version.pico_w }}
        run: |
          timeout 15m uv run --python ${{ matrix.python_runtime }} --no-dev -- rp2040py micropython --circuitpython --image ${{ matrix.circuitpython_version.tag }} --board pico_w tests/circuitpython/main-cyw43.py || \
            echo "::warning title=CircuitPython pico-w WLAN test failed::${{ matrix.python_runtime }}-${{ matrix.circuitpython_version.tag }} did not complete cleanly - see docs/records/0027-cyw43-wifi.md and docs/records/0048-cyw43-nat-reflector.md (this script opens a real TCP connection to 1.1.1.1:80 and resolves a real hostname through the emulator's NAT bridge - a transient CI-runner network hiccup, not necessarily an emulator regression, can also cause this)"
        env:
          PYTHON_JIT: ${{ matrix.python_runtime == 'cpython-3.14' && '1' || '' }}
