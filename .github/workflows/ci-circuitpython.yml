name: Test CircuitPython Releases

# There was no CircuitPython CI at all before this workflow (see
# docs/records/0048-cyw43-nat-reflector.md), even though README.md documents `--circuitpython` as
# a supported mode - which is how CircuitPython 10.x's boot stall went unnoticed until
# docs/records/0050-qspi-pad-reset-values.md root-caused it. 10.2.1 is in the matrix below as the
# regression test for exactly that fix.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-circuitpython:
    name: CircuitPython ${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Deliberately small. A CircuitPython boot costs minutes of emulated time, so this matrix
        # buys *firmware* coverage, not interpreter coverage - ci-micropython.yml already runs the
        # full pypy/cpython-3.10/cpython-3.14 spread on every release it tests, and nothing about
        # CircuitPython exercises the host interpreter differently. Three jobs, one runtime.
        include:
          # The project's own default (README), and the oldest thing we claim to support.
          # hard_reset: false - 8.0.2 does not come back over USB after a chip reset in this
          # emulator (measured 2026-08-20: it re-boots and then spins in SRAM, never
          # re-enumerating, where 9.2.9 and 10.2.1 both re-enumerate in ~20s). This was expected to
          # be the peripheral/pad state 0089's Phase 5 clears - **it is not**: re-measured after
          # that phase landed (2026-08-20), 8.0.2 still never comes back and ahard_reset() times
          # out. Cause still unknown, so the gate stays.
          - tag: "8.0.2"
            wlan: false
            hard_reset: false
          # WiFi through the CYW43 NAT bridge. 9.2.9 is the version
          # tests/circuitpython/main-cyw43.py was originally verified against (0048), kept as the
          # older of the two CYW43 host stacks this exercises.
          - tag: "9.2.9"
            wlan: true
            hard_reset: true
          # Regression test for 0050 - this is the version that used to hang forever - and, since
          # 2026-08-19, WiFi as well: 0048 asked for a live re-verification before moving the
          # CYW43 job to 10.x, and 0085 did it (scan/join/DHCP all the way to a DHCP address
          # rendered on an emulated panel), so this stops being banner-only.
          - tag: "10.2.1"
            wlan: true
            hard_reset: true

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.10"
          github-token: ${{ github.token }}

      - name: Install dependencies
        run: uv sync

      # Same reasoning as ci-micropython.yml: pull (and cache) the UF2 outside the timed steps, and
      # don't fail the job on a flaky download - the real step right after gives a clearer signal.
      - name: Warm up CircuitPython ${{ matrix.tag }} download cache
        continue-on-error: true
        run: uv run --no-dev -- rp2040py micropython --circuitpython --image ${{ matrix.tag }} --fetch-fw-only

      # Boots to the friendly REPL and exits as soon as the banner appears. Measured on a
      # developer machine (2026-08-16): 16s for 8.0.2, 9s for 10.2.1. The 5m cap is a runner-speed
      # allowance over that, not a guess - an earlier 10m here was ~40x the real cost and hid it.
      - name: Test CircuitPython ${{ matrix.tag }} boots
        run: timeout 5m uv run --no-dev -- rp2040py micropython --circuitpython --image ${{ matrix.tag }} --expect-text "Adafruit CircuitPython"

      # The CircuitPython half of 0089's Phase 1 reset-cause check (ci-micropython.yml has the
      # other). Power-on only: this runs over the raw REPL, so a microcontroller.reset() would drop
      # USB mid-exec with nothing waiting for the re-enumeration until 0089's Phase 2. It still
      # guards the row that matters most here - CHIP_RESET.HAD_POR with a clear WATCHDOG.REASON is
      # what makes a fresh boot report POWER_ON rather than a stale SOFTWARE/WATCHDOG.
      - name: Test CircuitPython reset reason ${{ matrix.tag }}
        run: timeout 5m uv run --no-dev -- rp2040py micropython --circuitpython --image ${{ matrix.tag }} tests/circuitpython/main-reset-cause.py

      # 0089's Phase 2, CircuitPython half: a host-initiated hard reset must re-enumerate, leave
      # the raw REPL usable, wipe the guest's RAM - and report RESET_PIN, which is the reset cause
      # the record could only *derive* before this existed (its Appendix's "What was not measured").
      - name: Test CircuitPython host-initiated hard reset ${{ matrix.tag }}
        if: ${{ matrix.hard_reset }}
        run: timeout 10m uv run --no-dev -- python tests/hard_reset_run.py --circuitpython --image ${{ matrix.tag }}

      # 0089's Phase 4, CircuitPython half: the RESET button. Gated on the same `hard_reset` flag
      # as the step above, and for the same reason - 8.0.2 never re-enumerates after a chip reset,
      # whichever trigger caused it. This is the family that reports the cause precisely
      # (`RESET_PIN`), so it is the sharper of the two live checks.
      - name: Test CircuitPython RESET button ${{ matrix.tag }}
        if: ${{ matrix.hard_reset }}
        run: timeout 10m uv run --no-dev -- python tests/reset_button_run.py --circuitpython --image ${{ matrix.tag }}

      # 0089's Phase 5, the sharper half: WiFi must still work after a hard reset. This could not
      # pass before that phase - releasing the pads made the driver re-init, but the emulated
      # CYW43439 had no WL_ON to see and still held the previous session's registers.
      - name: Test CircuitPython CYW43 comes back after a chip reset ${{ matrix.tag }}
        if: ${{ matrix.wlan && matrix.hard_reset }}
        run: timeout 10m uv run --no-dev -- python tests/chip_reset_run.py --cyw43 --image ${{ matrix.tag }}

      # CircuitPython's counterpart of ci-micropython.yml's pico-w WLAN step (33s measured
      # locally, 2026-08-16), and soft-failing for
      # the same reason: it opens a real TCP connection and a real DNS query to the internet
      # through the emulator's NAT bridge, so a CI-runner network hiccup is not an emulator
      # regression.
      - name: Test CircuitPython pico-w WLAN ${{ matrix.tag }}
        if: ${{ matrix.wlan }}
        run: |
          timeout 5m uv run --no-dev -- rp2040py micropython --circuitpython --image ${{ matrix.tag }} --board pico_w tests/circuitpython/main-cyw43.py || \
            echo "::warning title=CircuitPython pico-w WLAN test failed::${{ matrix.tag }} did not complete cleanly - see docs/records/0027-cyw43-wifi.md and docs/records/0048-cyw43-nat-reflector.md (this script opens a real TCP connection to 1.1.1.1:80 and resolves a real hostname through the emulator's NAT bridge - a transient CI-runner network hiccup, not necessarily an emulator regression, can also cause this)"
