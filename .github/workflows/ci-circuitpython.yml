name: Test CircuitPython Releases

# There was no CircuitPython CI at all before this workflow (see
# docs/records/0048-cyw43-nat-reflector.md), even though README.md documents `--circuitpython` as
# a supported mode - which is how CircuitPython 10.x's boot stall went unnoticed until
# docs/records/0050-qspi-pad-reset-values.md root-caused it. 10.2.1 is in the matrix below as the
# regression test for exactly that fix.

on:
  push:
    # branches only: a pushed tag is the same commit as the branch it was cut from, which already ran
    branches: ["**"]
    paths-ignore: &non-code-paths
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore: *non-code-paths

concurrency:
  group: ci-circuitpython-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, not one per release: the package (C++ extension + wasm module) takes ~2 minutes to build and every firmware check takes seconds, so it is built once here and
  # scripts/ci/circuitpython.sh runs every release in CIRCUITPYTHON_RELEASES one after another (and writes the per-step table to the job summary).
  #
  # Deliberately small. A CircuitPython boot costs minutes of emulated time, so this list buys *firmware* coverage, not interpreter coverage - ci-micropython.yml already runs the
  # full pypy/cpython-3.10/cpython-3.15 spread on every release it tests, and nothing about CircuitPython exercises the host interpreter differently. Three releases, one runtime.
  #   8.0.2   the oldest release this project claims to support. **Not** the default any more - that is 10.2.1 (`firmware_specs.json`), and every test that needs a reset runs there.
  #           Deliberately boot-only: it proves the oldest supported firmware still comes up, and nothing else is asserted on it. No `hard_reset` flag - 8.0.2 does not come back over
  #           USB after a chip reset in this emulator (measured 2026-08-20: it re-boots and then spins in SRAM, never re-enumerating). This was expected to be the peripheral/pad state
  #           0089's Phase 5 clears - **it is not**: re-measured after that phase landed, 8.0.2 still never comes back and ahard_reset() times out, while 9.2.9 and 10.2.1 both pass the
  #           same script. The boundary is 8.x vs 9.x; the cause is open in docs/records/0093-circuitpython-802-warm-boot-hang.md, so the gate stays.
  #   9.2.9   WiFi through the CYW43 NAT bridge. The version tests/circuitpython/main-cyw43.py was originally verified against (0048), kept as the older of the two CYW43 host stacks
  #           this exercises.
  #   10.2.1  Regression test for 0050 - the version that used to hang forever - and, since 2026-08-19, WiFi as well: 0048 asked for a live re-verification before moving the CYW43
  #           job to 10.x, and 0085 did it (scan/join/DHCP all the way to a DHCP address rendered on an emulated panel), so this stops being banner-only.
  test-circuitpython:
    name: CircuitPython / cpython-3.10
    runs-on: ubuntu-latest
    env:
      # tag[:flag,flag]: hard_reset = the chip is reset and must re-enumerate; wlan = the Pico W Wi-Fi checks.
      CIRCUITPYTHON_RELEASES: "8.0.2 9.2.9:hard_reset,wlan 10.2.1:hard_reset,wlan"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.10"
          github-token: ${{ github.token }}
          enable-cache: true

      # The one build of the package (no dev group: the checks below need only the runtime dependencies).
      - name: Install the package
        run: uv sync --python cpython-3.10 --no-dev

      - name: Run the CircuitPython checks
        run: scripts/ci/circuitpython.sh cpython-3.10 $CIRCUITPYTHON_RELEASES
